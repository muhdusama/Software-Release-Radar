services:
  software-release-radar:
    container_name: software-release-radar
    build:
      context: .
      dockerfile: Dockerfile
    image: software-release-radar:${SRR_VERSION:-dev}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${SRR_HOST_PORT:-9120}:${SRR_CONTAINER_PORT:-9120}"
    volumes:
      - "${SRR_DATA_DIR:-./data}:/app/data"

