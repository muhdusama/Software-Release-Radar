x-radar-environment: &radar-environment
  RADAR_DB: /data/radar.db
  RADAR_SSH_DIR: /ssh
  RADAR_SCHEDULER_INTERVAL_SECONDS: "${RADAR_SCHEDULER_INTERVAL_SECONDS:-60}"
  RADAR_SCHEDULER_LOG_RESULTS: "${RADAR_SCHEDULER_LOG_RESULTS:-false}"
  RADAR_LOG_LEVEL: "${RADAR_LOG_LEVEL:-INFO}"
  ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
  ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
  ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH is required}"
  SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
  ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}"
  GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
  SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
  TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
  AI_USER_10_MINUTE_LIMIT: "${AI_USER_10_MINUTE_LIMIT:-10}"
  AI_USER_DAILY_LIMIT: "${AI_USER_DAILY_LIMIT:-50}"
  AI_IP_HOURLY_LIMIT: "${AI_IP_HOURLY_LIMIT:-30}"
  AI_USER_CONCURRENCY_LIMIT: "${AI_USER_CONCURRENCY_LIMIT:-1}"
  AI_GLOBAL_CONCURRENCY_LIMIT: "${AI_GLOBAL_CONCURRENCY_LIMIT:-4}"
  AI_REQUEST_LEASE_SECONDS: "${AI_REQUEST_LEASE_SECONDS:-180}"
  AI_QUESTION_MAX_CHARS: "${AI_QUESTION_MAX_CHARS:-4000}"
  PASSWORD_RESET_MIN_SECONDS: "${PASSWORD_RESET_MIN_SECONDS:-0.35}"
  ALLOW_INSECURE_INTEGRATIONS: "${ALLOW_INSECURE_INTEGRATIONS:-false}"

services:
  radar:
    image: "ghcr.io/muhdusama/software-release-radar:${RADAR_VERSION:-2.10.9}"
    build:
      context: .
      args:
        APP_VERSION: "${RADAR_VERSION:-2.10.9}"
        VCS_REF: "${RADAR_BUILD_COMMIT:-}"
    restart: unless-stopped
    environment:
      <<: *radar-environment
    ports:
      - "${RADAR_BIND_ADDRESS:-0.0.0.0}:${RADAR_PORT:-9120}:8080"
    volumes:
      - radar-data:/data
      - ./ssh:/ssh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)); assert d.get('status') == 'ok'"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  scheduler:
    image: "ghcr.io/muhdusama/software-release-radar:${RADAR_VERSION:-2.10.9}"
    build:
      context: .
      args:
        APP_VERSION: "${RADAR_VERSION:-2.10.9}"
        VCS_REF: "${RADAR_BUILD_COMMIT:-}"
    restart: unless-stopped
    environment:
      <<: *radar-environment
    command: ["python", "-m", "radar.scheduler"]
    healthcheck:
      disable: true
    depends_on:
      radar:
        condition: service_healthy
    volumes:
      - radar-data:/data
      - ./ssh:/ssh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  portainer-worker:
    image: "ghcr.io/muhdusama/software-release-radar:${RADAR_VERSION:-2.10.9}"
    build:
      context: .
      args:
        APP_VERSION: "${RADAR_VERSION:-2.10.9}"
        VCS_REF: "${RADAR_BUILD_COMMIT:-}"
    restart: unless-stopped
    environment:
      <<: *radar-environment
    command: ["python", "-m", "radar.inventory_worker"]
    healthcheck:
      disable: true
    depends_on:
      radar:
        condition: service_healthy
    volumes:
      - radar-data:/data
      - ./ssh:/ssh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mcp:
    profiles: [mcp]
    image: "ghcr.io/muhdusama/software-release-radar:${RADAR_VERSION:-2.10.9}"
    build:
      context: .
      args:
        APP_VERSION: "${RADAR_VERSION:-2.10.9}"
        VCS_REF: "${RADAR_BUILD_COMMIT:-}"
    restart: unless-stopped
    command: ["python", "-m", "radar.mcp_server"]
    environment:
      <<: *radar-environment
      RADAR_MCP_ALLOWED_HOSTS: "${RADAR_MCP_ALLOWED_HOSTS:-}"
      RADAR_MCP_ALLOWED_ORIGINS: "${RADAR_MCP_ALLOWED_ORIGINS:-}"
      RADAR_MCP_FORWARDED_ALLOW_IPS: "${RADAR_MCP_FORWARDED_ALLOW_IPS:-}"
      RADAR_MCP_ALLOW_HTTP: "${RADAR_MCP_ALLOW_HTTP:-false}"
      RADAR_MCP_PUBLIC_URL: "${RADAR_MCP_PUBLIC_URL:-}"
      MCP_KEY_MINUTE_LIMIT: "${MCP_KEY_MINUTE_LIMIT:-120}"
      MCP_OPERATION_HOURLY_LIMIT: "${MCP_OPERATION_HOURLY_LIMIT:-20}"
      MCP_OPERATION_KEY_CONCURRENCY: "${MCP_OPERATION_KEY_CONCURRENCY:-1}"
      MCP_OPERATION_GLOBAL_CONCURRENCY: "${MCP_OPERATION_GLOBAL_CONCURRENCY:-2}"
      MCP_OPERATION_LEASE_SECONDS: "${MCP_OPERATION_LEASE_SECONDS:-300}"
      MCP_AUTH_FAILURE_LIMIT: "${MCP_AUTH_FAILURE_LIMIT:-20}"
    ports:
      - "127.0.0.1:${RADAR_MCP_PORT:-9121}:8081"
    volumes:
      - radar-data:/data
      - ./ssh:/ssh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,os,urllib.request; host=os.environ['RADAR_MCP_ALLOWED_HOSTS'].split(',')[0].strip(); req=urllib.request.Request('http://127.0.0.1:8081/healthz',headers={'Host':host}); assert json.load(urllib.request.urlopen(req,timeout=5)) == {'status':'ok'}"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

volumes:
  radar-data:
