services:
  radar:
    image: "software-release-radar:${RADAR_VERSION:-2.7.0}"
    build:
      context: .
      args:
        APP_VERSION: "${RADAR_VERSION:-2.7.0}"
        VCS_REF: "${RADAR_BUILD_COMMIT:-}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RADAR_DB: /data/radar.db
      RADAR_SSH_DIR: /ssh
    ports:
      - "${RADAR_BIND_ADDRESS:-0.0.0.0}:${RADAR_PORT:-9120}:8080"
    volumes:
      - radar-data:/data
      - ./ssh:/ssh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)); assert d.get('status') == 'ok'"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  scheduler:
    image: "software-release-radar:${RADAR_VERSION:-2.7.0}"
    build:
      context: .
      args:
        APP_VERSION: "${RADAR_VERSION:-2.7.0}"
        VCS_REF: "${RADAR_BUILD_COMMIT:-}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RADAR_DB: /data/radar.db
      RADAR_SSH_DIR: /ssh
    command: ["python", "-m", "radar.scheduler"]
    healthcheck:
      disable: true
    depends_on:
      radar:
        condition: service_healthy
    volumes:
      - radar-data:/data
      - ./ssh:/ssh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  portainer-worker:
    image: "software-release-radar:${RADAR_VERSION:-2.7.0}"
    build:
      context: .
      args:
        APP_VERSION: "${RADAR_VERSION:-2.7.0}"
        VCS_REF: "${RADAR_BUILD_COMMIT:-}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RADAR_DB: /data/radar.db
      RADAR_SSH_DIR: /ssh
    command: ["python", "-m", "radar.portainer_worker"]
    healthcheck:
      disable: true
    depends_on:
      radar:
        condition: service_healthy
    volumes:
      - radar-data:/data
      - ./ssh:/ssh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  radar-data:
