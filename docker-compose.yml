services:
  radar:
    image: "software-release-radar:${RADAR_VERSION:-2.6.3}"
    build:
      context: .
      args:
        APP_VERSION: "${RADAR_VERSION:-2.6.3}"
    container_name: software-release-radar
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RADAR_DB: /data/radar.db
      RADAR_SSH_DIR: /ssh
    ports:
      - "${RADAR_PORT:-9120}:8080"
    volumes:
      - radar-data:/data
      - ./ssh:/ssh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)); assert d.get('status') == 'ok'"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  portainer-worker:
    image: "software-release-radar:${RADAR_VERSION:-2.6.3}"
    build:
      context: .
      args:
        APP_VERSION: "${RADAR_VERSION:-2.6.3}"
    container_name: software-release-radar-portainer-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RADAR_DB: /data/radar.db
      RADAR_SSH_DIR: /ssh
    command: ["python", "-m", "radar.portainer_worker"]
    depends_on:
      radar:
        condition: service_healthy
    volumes:
      - radar-data:/data
      - ./ssh:/ssh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  radar-data:
    name: software-release-radar-data
