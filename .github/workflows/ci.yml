name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python 3.13 tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python compilation and whitespace
        run: |
          python -m compileall -q radar scripts tests
          git diff --check

      - name: Run complete test suite
        run: python -m unittest discover -s tests -v

  security-audit:
    name: Dependency and Python security audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install security scanners
        run: python -m pip install "pip-audit==2.10.1" "bandit==1.9.4"

      - name: Audit Python dependencies for known vulnerabilities
        run: python -m pip_audit -r requirements.txt

      - name: Run Bandit and enforce reviewed high-confidence findings
        run: |
          set -Eeuo pipefail
          bandit -r radar -q -ll -f json -o /tmp/bandit.json || true
          python scripts/check_bandit.py /tmp/bandit.json

  docker-acceptance:
    name: Public Docker setup and recovery acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the real public first-run setup
        env:
          RADAR_SETUP_NONINTERACTIVE: "true"
          RADAR_SETUP_VERSION: "ci"
          RADAR_SETUP_BIND_ADDRESS: "127.0.0.1"
          RADAR_SETUP_PORT: "9120"
          RADAR_SETUP_USERNAME: "admin"
          RADAR_SETUP_EMAIL: "admin@example.com"
          RADAR_SETUP_PASSWORD: "ci-release-radar-password"
        run: |
          set -Eeuo pipefail
          trap 'if [ -f .env ]; then docker compose logs --no-color > /tmp/software-release-radar-compose.log 2>&1 || true; docker compose down -v --remove-orphans || true; fi' EXIT
          bash scripts/setup.sh

          test "$(stat -c '%a' .env)" = "600"
          curl -fsS http://127.0.0.1:9120/healthz > /tmp/health.json
          curl -fsS http://127.0.0.1:9120/login >/dev/null

          python - <<'PY'
          import json
          payload = json.load(open('/tmp/health.json', encoding='utf-8'))
          assert payload['status'] == 'ok', payload
          assert payload['name'] == 'Software Release Radar', payload
          PY

          radar_id="$(docker compose ps -q radar)"
          scheduler_id="$(docker compose ps -q scheduler)"
          worker_id="$(docker compose ps -q portainer-worker)"
          test -n "$radar_id"
          test -n "$scheduler_id"
          test -n "$worker_id"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$radar_id")" = "healthy"
          test "$(docker inspect --format '{{.State.Status}}' "$scheduler_id")" = "running"
          test "$(docker inspect --format '{{.State.Status}}' "$worker_id")" = "running"

          echo "Testing online backup..."
          bash scripts/backup.sh ci-backup ./backups
          test -f ./backups/radar-ci-backup.db

          echo "Testing guarded restore..."
          bash scripts/restore.sh ./backups/radar-ci-backup.db --confirm

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9120/healthz >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:9120/healthz >/dev/null
          curl -fsS http://127.0.0.1:9120/login >/dev/null

          echo "Testing restart with persistent state..."
          docker compose restart
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9120/healthz >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:9120/healthz >/dev/null
          docker compose ps

      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compose-logs
          path: /tmp/software-release-radar-compose.log
          if-no-files-found: ignore
