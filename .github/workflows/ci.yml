name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python 3.13 tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python compilation and whitespace
        run: |
          python -m compileall -q radar scripts tests
          git diff --check

      - name: Run complete test suite
        run: python -m unittest discover -s tests -v

  docker-smoke:
    name: Clean Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create isolated test environment
        run: |
          python - <<'PY' > .env
          import base64
          import os
          import secrets
          print("RADAR_VERSION=ci")
          print("RADAR_PORT=9120")
          print("RADAR_SCHEDULER_INTERVAL_SECONDS=60")
          print("RADAR_SCHEDULER_LOG_RESULTS=false")
          print("RADAR_LOG_LEVEL=INFO")
          print("ADMIN_USERNAME=admin")
          print("ADMIN_EMAIL=admin@example.com")
          print("ADMIN_PASSWORD_HASH=")
          print("SECRET_KEY=" + secrets.token_urlsafe(48))
          print("ENCRYPTION_KEY=" + base64.urlsafe_b64encode(os.urandom(32)).decode("ascii"))
          print("GITHUB_TOKEN=")
          print("SESSION_COOKIE_SECURE=false")
          print("TRUST_PROXY_HEADERS=false")
          PY
          mkdir -p ssh
          chmod 600 .env

      - name: Validate Compose configuration
        run: docker compose config >/dev/null

      - name: Build images
        run: docker compose build --pull

      - name: Start clean stack and verify health
        run: |
          set -Eeuo pipefail
          trap 'docker compose logs --no-color > /tmp/software-release-radar-compose.log 2>&1 || true; docker compose down -v --remove-orphans' EXIT
          docker compose up -d

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9120/healthz > /tmp/health.json; then
              break
            fi
            sleep 2
          done

          python - <<'PY'
          import json
          payload = json.load(open('/tmp/health.json', encoding='utf-8'))
          assert payload['status'] == 'ok', payload
          assert payload['name'] == 'Software Release Radar', payload
          PY

          test "$(docker inspect --format '{{.State.Health.Status}}' software-release-radar)" = "healthy"
          test "$(docker inspect --format '{{.State.Status}}' software-release-radar-scheduler)" = "running"
          test "$(docker inspect --format '{{.State.Status}}' software-release-radar-portainer-worker)" = "running"

          curl -fsS http://127.0.0.1:9120/login >/dev/null
          docker compose ps

      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: /tmp/software-release-radar-compose.log
          if-no-files-found: ignore
