name: Apply prepared feature update

on:
  push:
    branches:
      - feature/fleet-name-sync-notification-controls
    paths:
      - .github/workflows/apply-feature-update.yml
      - .github/feature-update.patch.xz.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/fleet-name-sync-notification-controls

      - name: Apply prepared source patch
        shell: bash
        run: |
          set -Eeuo pipefail
          bundle=.github/feature-update.patch.xz.b64
          if [[ ! -f "$bundle" ]]; then
            echo "Prepared patch is not present yet."
            exit 0
          fi
          tr -d '\n\r' < "$bundle" | base64 --decode > /tmp/feature-update.patch.xz
          echo "62e82f593c6fcfe453fd9583070c2f1338a5bd68f7c24fc829c9ebaa3cfdde12  /tmp/feature-update.patch.xz" | sha256sum -c -
          xz -dc /tmp/feature-update.patch.xz > /tmp/feature-update.patch
          git apply --index --whitespace=error-all /tmp/feature-update.patch
          rm -f "$bundle"
          rm -f .github/feature-update.tar.xz.b64
          rm -f .github/feature-update.ready
          rm -f .github/feature-update.part-*
          rm -f .github/workflows/export-feature-source.yml
          rm -f .github/workflows/apply-feature-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release v2.8.0 with Fleet naming and notification controls"
          git push origin HEAD:feature/fleet-name-sync-notification-controls
