<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Software Release Radar roadmap journey</title>
  <desc id="desc">A large five-stage roadmap showing public release readiness, community foundation, release intelligence, integrations and exploratory assistance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63e6ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="980" rx="38" fill="url(#bg)"/>

  <text x="600" y="72" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="46" font-weight="750">Where Software Release Radar is heading</text>
  <text x="600" y="112" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="22">Direction rather than fixed deadlines. Community input helps shape priority.</text>

  <path d="M128 205 V770" stroke="#263650" stroke-width="12" stroke-linecap="round"/>
  <path d="M128 205 V335" stroke="url(#progress)" stroke-width="12" stroke-linecap="round"/>

  <g font-family="system-ui,sans-serif">
    <g transform="translate(80 160)">
      <circle cx="48" cy="65" r="34" fill="#173f4a" stroke="#63e6ff" stroke-width="5"/>
      <text x="48" y="73" text-anchor="middle" fill="#63e6ff" font-size="20" font-weight="800">NOW</text>
      <rect x="105" y="0" width="990" height="130" rx="24" fill="#131e33" stroke="#2f6170" stroke-width="2"/>
      <text x="142" y="44" fill="#63e6ff" font-size="19" font-weight="750">PUBLIC RELEASE READINESS</text>
      <text x="142" y="79" fill="#f8fafc" font-size="31" font-weight="750">Sanitise, validate and ship v2.6.3</text>
      <text x="142" y="109" fill="#a8b4c7" font-size="20">Clean source, Docker deployment, privacy checks, tests and launch gates.</text>
    </g>

    <g transform="translate(80 305)">
      <circle cx="48" cy="65" r="32" fill="#182b43" stroke="#7dd3fc" stroke-width="4"/>
      <text x="48" y="73" text-anchor="middle" fill="#dbeafe" font-size="18" font-weight="800">NEXT</text>
      <rect x="105" y="0" width="990" height="130" rx="24" fill="#131e33" stroke="#30455f" stroke-width="2"/>
      <text x="142" y="44" fill="#7dd3fc" font-size="19" font-weight="750">COMMUNITY FOUNDATION</text>
      <text x="142" y="79" fill="#f8fafc" font-size="31" font-weight="750">Make self-hosting and contribution easy</text>
      <text x="142" y="109" fill="#a8b4c7" font-size="20">Better setup, CI, documentation, demo data and contributor-friendly issues.</text>
    </g>

    <g transform="translate(80 450)">
      <circle cx="48" cy="65" r="32" fill="#24213f" stroke="#a78bfa" stroke-width="4"/>
      <text x="48" y="73" text-anchor="middle" fill="#ddd6fe" font-size="17" font-weight="800">THEN</text>
      <rect x="105" y="0" width="990" height="130" rx="24" fill="#131e33" stroke="#4d4270" stroke-width="2"/>
      <text x="142" y="44" fill="#c4b5fd" font-size="19" font-weight="750">RELEASE INTELLIGENCE</text>
      <text x="142" y="79" fill="#f8fafc" font-size="31" font-weight="750">Make update decisions more useful</text>
      <text x="142" y="109" fill="#a8b4c7" font-size="20">Breaking-change context, release-note comparison and smarter version handling.</text>
    </g>

    <g transform="translate(80 595)">
      <circle cx="48" cy="65" r="32" fill="#28203f" stroke="#8b5cf6" stroke-width="4"/>
      <text x="48" y="73" text-anchor="middle" fill="#c4b5fd" font-size="16" font-weight="800">LATER</text>
      <rect x="105" y="0" width="990" height="130" rx="24" fill="#131e33" stroke="#4d3a70" stroke-width="2"/>
      <text x="142" y="44" fill="#a78bfa" font-size="19" font-weight="750">FLEET AND INTEGRATIONS</text>
      <text x="142" y="79" fill="#f8fafc" font-size="31" font-weight="750">Broaden how Release Radar connects</text>
      <text x="142" y="109" fill="#a8b4c7" font-size="20">Fleet discovery, stable APIs, providers and stronger Portainer workflows.</text>
    </g>

    <g transform="translate(80 740)">
      <circle cx="48" cy="65" r="32" fill="#222b3b" stroke="#64748b" stroke-width="4"/>
      <text x="48" y="73" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="800">EXPLORE</text>
      <rect x="105" y="0" width="990" height="130" rx="24" fill="#131e33" stroke="#34425a" stroke-width="2"/>
      <text x="142" y="44" fill="#cbd5e1" font-size="19" font-weight="750">ASSISTANCE WITHOUT DEPENDENCY</text>
      <text x="142" y="79" fill="#f8fafc" font-size="31" font-weight="750">Use AI only where it adds real value</text>
      <text x="142" y="109" fill="#a8b4c7" font-size="20">Release summaries and explanations while core monitoring stays deterministic.</text>
    </g>
  </g>

  <rect x="165" y="900" width="870" height="56" rx="28" fill="#172238" stroke="#394862"/>
  <text x="600" y="936" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="21" font-weight="650">★ Community votes help credible roadmap candidates move forward</text>
</svg>
