<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Software Release Radar dashboard reference</title>
  <desc id="desc">Neutral demo dashboard showing software updates, healthy services, attention items and recent release cards.</desc>
  <rect width="1440" height="900" fill="#0b1220"/>
  <rect x="24" y="24" width="1392" height="852" rx="28" fill="#10192b" stroke="#27344d"/>
  <rect x="24" y="24" width="250" height="852" rx="28" fill="#0e1728"/>

  <circle cx="76" cy="78" r="24" fill="none" stroke="#63e6ff" stroke-width="3"/>
  <circle cx="76" cy="78" r="13" fill="none" stroke="#34425f" stroke-width="2"/>
  <path d="M76 78l17-13" stroke="#63e6ff" stroke-width="3"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="114" y="78" dominant-baseline="middle" fill="#f8fafc" font-size="22" font-weight="700">Release Radar</text>

    <g font-size="18">
      <text x="56" y="160" dominant-baseline="middle" fill="#63e6ff">●  Dashboard</text>
      <text x="56" y="210" dominant-baseline="middle" fill="#94a3b8">○  Review Queue</text>
      <text x="56" y="260" dominant-baseline="middle" fill="#94a3b8">○  Fleet</text>
      <text x="56" y="310" dominant-baseline="middle" fill="#94a3b8">○  Software</text>
      <text x="56" y="360" dominant-baseline="middle" fill="#94a3b8">○  Settings</text>
    </g>

    <text x="318" y="78" dominant-baseline="middle" fill="#f8fafc" font-size="34" font-weight="700">Dashboard</text>
    <text x="318" y="114" dominant-baseline="middle" fill="#94a3b8" font-size="16">Demo data · Reference visual</text>

    <g transform="translate(318 154)">
      <rect width="240" height="118" rx="18" fill="#152038"/>
      <text x="22" y="32" dominant-baseline="middle" fill="#94a3b8" font-size="16">Updates available</text>
      <text x="22" y="82" dominant-baseline="middle" fill="#f8fafc" font-size="42" font-weight="700">7</text>
    </g>
    <g transform="translate(580 154)">
      <rect width="240" height="118" rx="18" fill="#152038"/>
      <text x="22" y="32" dominant-baseline="middle" fill="#94a3b8" font-size="16">Healthy services</text>
      <text x="22" y="82" dominant-baseline="middle" fill="#63e6ff" font-size="42" font-weight="700">28</text>
    </g>
    <g transform="translate(842 154)">
      <rect width="240" height="118" rx="18" fill="#152038"/>
      <text x="22" y="32" dominant-baseline="middle" fill="#94a3b8" font-size="16">Needs attention</text>
      <text x="22" y="82" dominant-baseline="middle" fill="#f5c56b" font-size="42" font-weight="700">3</text>
    </g>
    <g transform="translate(1104 154)">
      <rect width="240" height="118" rx="18" fill="#152038"/>
      <text x="22" y="32" dominant-baseline="middle" fill="#94a3b8" font-size="16">Tracked software</text>
      <text x="22" y="82" dominant-baseline="middle" fill="#c4b5fd" font-size="42" font-weight="700">35</text>
    </g>

    <text x="318" y="330" dominant-baseline="middle" fill="#f8fafc" font-size="24" font-weight="650">Release activity</text>

    <g transform="translate(318 360)">
      <rect width="1026" height="106" rx="16" fill="#131e33"/>
      <circle cx="42" cy="53" r="20" fill="#243450"/>
      <text x="78" y="35" dominant-baseline="middle" fill="#f8fafc" font-size="19" font-weight="650">Demo Media Server</text>
      <text x="78" y="67" dominant-baseline="middle" fill="#94a3b8" font-size="15">Installed 1.4.2 → Latest 1.5.0</text>
      <rect x="825" y="35" width="165" height="36" rx="18" fill="#163b42"/>
      <text x="907.5" y="53" text-anchor="middle" dominant-baseline="middle" fill="#63e6ff" font-size="15" font-weight="650">UPDATE READY</text>
    </g>

    <g transform="translate(318 480)">
      <rect width="1026" height="106" rx="16" fill="#131e33"/>
      <circle cx="42" cy="53" r="20" fill="#243450"/>
      <text x="78" y="35" dominant-baseline="middle" fill="#f8fafc" font-size="19" font-weight="650">Demo Photo Library</text>
      <text x="78" y="67" dominant-baseline="middle" fill="#94a3b8" font-size="15">Installed 3.8.1 → Latest 3.8.1</text>
      <rect x="850" y="35" width="140" height="36" rx="18" fill="#1f3146"/>
      <text x="920" y="53" text-anchor="middle" dominant-baseline="middle" fill="#a7f3d0" font-size="15" font-weight="650">CURRENT</text>
    </g>

    <g transform="translate(318 600)">
      <rect width="1026" height="106" rx="16" fill="#131e33"/>
      <circle cx="42" cy="53" r="20" fill="#243450"/>
      <text x="78" y="35" dominant-baseline="middle" fill="#f8fafc" font-size="19" font-weight="650">Demo Automation Hub</text>
      <text x="78" y="67" dominant-baseline="middle" fill="#94a3b8" font-size="15">Upstream comparison unavailable</text>
      <rect x="814" y="35" width="176" height="36" rx="18" fill="#47331d"/>
      <text x="902" y="53" text-anchor="middle" dominant-baseline="middle" fill="#f5c56b" font-size="15" font-weight="650">NEEDS ATTENTION</text>
    </g>

    <rect x="318" y="744" width="1026" height="80" rx="16" fill="#0e1728" stroke="#263650"/>
    <text x="344" y="774" dominant-baseline="middle" fill="#94a3b8" font-size="15">Reference screenshot · generated with neutral demo data · not a production capture</text>
    <text x="344" y="804" dominant-baseline="middle" fill="#64748b" font-size="14">Final screenshots will be regenerated from the sanitised public build before launch.</text>
  </g>
</svg>
