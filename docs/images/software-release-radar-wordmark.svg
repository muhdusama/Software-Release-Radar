<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Software Release Radar wordmark</title>
  <desc id="desc">Software Release Radar branding with a radar icon and project name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63e6ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="46" fill="url(#bg)"/>
  <g transform="translate(58 48)">
    <circle cx="102" cy="102" r="90" fill="none" stroke="#34425f" stroke-width="3"/>
    <circle cx="102" cy="102" r="60" fill="none" stroke="#34425f" stroke-width="3"/>
    <circle cx="102" cy="102" r="30" fill="none" stroke="#34425f" stroke-width="3"/>
    <path d="M102 102 L178 48" stroke="url(#beam)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="158" cy="62" r="9" fill="#63e6ff"/>
    <circle cx="139" cy="129" r="7" fill="#8b5cf6"/>
    <circle cx="102" cy="102" r="8" fill="#f8fafc"/>
  </g>
  <text x="286" y="126" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="66" font-weight="700">Software Release Radar</text>
  <text x="290" y="181" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28">Know what changed before you update.</text>
  <g transform="translate(290 215)">
    <rect width="170" height="38" rx="19" fill="#172238"/>
    <text x="20" y="26" fill="#63e6ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="600">SELF-HOSTED</text>
    <rect x="184" width="166" height="38" rx="19" fill="#172238"/>
    <text x="204" y="26" fill="#c4b5fd" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="600">OPEN SOURCE</text>
    <rect x="364" width="140" height="38" rx="19" fill="#172238"/>
    <text x="386" y="26" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="600">AGPL-3.0</text>
  </g>
