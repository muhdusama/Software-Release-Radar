<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Software Release Radar wordmark</title>
  <desc id="desc">Software Release Radar branding with a radar icon and project name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63e6ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="48" fill="url(#bg)"/>

  <g transform="translate(62 68)">
    <circle cx="102" cy="102" r="90" fill="none" stroke="#34425f" stroke-width="3"/>
    <circle cx="102" cy="102" r="60" fill="none" stroke="#34425f" stroke-width="3"/>
    <circle cx="102" cy="102" r="30" fill="none" stroke="#34425f" stroke-width="3"/>
    <path d="M102 102 L178 48" stroke="url(#beam)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="158" cy="62" r="9" fill="#63e6ff"/>
    <circle cx="139" cy="129" r="7" fill="#8b5cf6"/>
    <circle cx="102" cy="102" r="8" fill="#f8fafc"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="300" y="114" fill="#f8fafc" font-size="66" font-weight="750" dominant-baseline="middle">Software Release Radar</text>
    <text x="304" y="174" fill="#94a3b8" font-size="28" dominant-baseline="middle">Know what changed before you update.</text>

    <g transform="translate(304 224)">
      <rect width="182" height="44" rx="22" fill="#172238"/>
      <text x="91" y="22" text-anchor="middle" dominant-baseline="middle" fill="#63e6ff" font-size="18" font-weight="700">SELF-HOSTED</text>

      <rect x="196" width="184" height="44" rx="22" fill="#172238"/>
      <text x="288" y="22" text-anchor="middle" dominant-baseline="middle" fill="#c4b5fd" font-size="18" font-weight="700">OPEN SOURCE</text>

      <rect x="394" width="158" height="44" rx="22" fill="#172238"/>
      <text x="473" y="22" text-anchor="middle" dominant-baseline="middle" fill="#f8fafc" font-size="18" font-weight="700">AGPL-3.0</text>
    </g>
  </g>
</svg>
