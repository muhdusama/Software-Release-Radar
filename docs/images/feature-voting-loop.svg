<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Software Release Radar feature voting loop</title>
  <desc id="desc">A large six-stage visual flow from feature idea to proposal, community signal, roadmap poll, planned work and shipped release.</desc>
  <rect width="1200" height="900" rx="38" fill="#0b1220"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="600" y="74" text-anchor="middle" dominant-baseline="middle" fill="#f8fafc" font-size="46" font-weight="750">Help decide what gets built next</text>
    <text x="600" y="118" text-anchor="middle" dominant-baseline="middle" fill="#94a3b8" font-size="22">Propose · discuss · vote · prioritise · build · ship</text>

    <g transform="translate(80 175)">
      <rect width="310" height="190" rx="26" fill="#131e33" stroke="#314159" stroke-width="2"/>
      <text x="155" y="48" text-anchor="middle" dominant-baseline="middle" font-size="46">💡</text>
      <text x="155" y="101" text-anchor="middle" dominant-baseline="middle" fill="#f8fafc" font-size="29" font-weight="750">1. Idea</text>
      <text x="155" y="140" text-anchor="middle" dominant-baseline="middle" fill="#a8b4c7" font-size="19">Start with a real problem</text>
      <text x="155" y="168" text-anchor="middle" dominant-baseline="middle" fill="#7f8da3" font-size="16">that Release Radar could solve.</text>
    </g>

    <g transform="translate(445 175)">
      <rect width="310" height="190" rx="26" fill="#131e33" stroke="#396074" stroke-width="2"/>
      <text x="155" y="48" text-anchor="middle" dominant-baseline="middle" font-size="46">📝</text>
      <text x="155" y="101" text-anchor="middle" dominant-baseline="middle" fill="#f8fafc" font-size="29" font-weight="750">2. Proposal</text>
      <text x="155" y="140" text-anchor="middle" dominant-baseline="middle" fill="#a8b4c7" font-size="19">Open a structured issue</text>
      <text x="155" y="168" text-anchor="middle" dominant-baseline="middle" fill="#7f8da3" font-size="16">with the use case and outcome.</text>
    </g>

    <g transform="translate(810 175)">
      <rect width="310" height="190" rx="26" fill="#131e33" stroke="#63e6ff" stroke-width="3"/>
      <text x="155" y="48" text-anchor="middle" dominant-baseline="middle" font-size="46">👍</text>
      <text x="155" y="101" text-anchor="middle" dominant-baseline="middle" fill="#f8fafc" font-size="27" font-weight="750">3. Community signal</text>
      <text x="155" y="140" text-anchor="middle" dominant-baseline="middle" fill="#a8b4c7" font-size="19">Use reactions and discussion</text>
      <text x="155" y="168" text-anchor="middle" dominant-baseline="middle" fill="#7f8da3" font-size="16">to show demand and context.</text>
    </g>

    <path d="M600 390 V438" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="M588 426 L600 440 L612 426" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(80 470)">
      <rect width="310" height="190" rx="26" fill="#131e33" stroke="#8b5cf6" stroke-width="3"/>
      <text x="155" y="48" text-anchor="middle" dominant-baseline="middle" font-size="46">🗳️</text>
      <text x="155" y="101" text-anchor="middle" dominant-baseline="middle" fill="#f8fafc" font-size="29" font-weight="750">4. Roadmap poll</text>
      <text x="155" y="140" text-anchor="middle" dominant-baseline="middle" fill="#a8b4c7" font-size="19">Compare strong candidates</text>
      <text x="155" y="168" text-anchor="middle" dominant-baseline="middle" fill="#7f8da3" font-size="16">when direct community input helps.</text>
    </g>

    <g transform="translate(445 470)">
      <rect width="310" height="190" rx="26" fill="#131e33" stroke="#8b5cf6" stroke-width="3"/>
      <text x="155" y="48" text-anchor="middle" dominant-baseline="middle" font-size="46">🛠️</text>
      <text x="155" y="101" text-anchor="middle" dominant-baseline="middle" fill="#f8fafc" font-size="29" font-weight="750">5. Planned</text>
      <text x="155" y="140" text-anchor="middle" dominant-baseline="middle" fill="#a8b4c7" font-size="19">Design, build and test</text>
      <text x="155" y="168" text-anchor="middle" dominant-baseline="middle" fill="#7f8da3" font-size="16">against the project priorities.</text>
    </g>

    <g transform="translate(810 470)">
      <rect width="310" height="190" rx="26" fill="#16372f" stroke="#34d399" stroke-width="3"/>
      <text x="155" y="48" text-anchor="middle" dominant-baseline="middle" font-size="46">🚀</text>
      <text x="155" y="101" text-anchor="middle" dominant-baseline="middle" fill="#f8fafc" font-size="29" font-weight="750">6. Shipped</text>
      <text x="155" y="140" text-anchor="middle" dominant-baseline="middle" fill="#b7ead4" font-size="19">The feature lands in a release</text>
      <text x="155" y="168" text-anchor="middle" dominant-baseline="middle" fill="#8fc9b2" font-size="16">and is recorded in the changelog.</text>
    </g>

    <rect x="110" y="735" width="980" height="105" rx="28" fill="#172238" stroke="#394862"/>
    <text x="600" y="774" text-anchor="middle" dominant-baseline="middle" fill="#f8fafc" font-size="23" font-weight="700">Votes are an input, not an automatic promise.</text>
    <text x="600" y="812" text-anchor="middle" dominant-baseline="middle" fill="#a8b4c7" font-size="19">Security, reliability, maintenance cost and technical fit can still outrank popularity.</text>
  </g>
</svg>
