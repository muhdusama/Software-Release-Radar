<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Software Release Radar review queue reference</title>
  <desc id="desc">Neutral demo review queue showing release decisions, priority, risk and release-note summaries.</desc>

  <rect width="1440" height="980" fill="#0b1220"/>
  <rect x="24" y="24" width="1392" height="932" rx="28" fill="#10192b" stroke="#27344d"/>
  <rect x="24" y="24" width="250" height="932" rx="28" fill="#0e1728"/>

  <circle cx="76" cy="78" r="24" fill="none" stroke="#63e6ff" stroke-width="3"/>
  <circle cx="76" cy="78" r="13" fill="none" stroke="#34425f" stroke-width="2"/>
  <path d="M76 78l17-13" stroke="#63e6ff" stroke-width="3"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="114" y="78" dominant-baseline="middle" fill="#f8fafc" font-size="22" font-weight="700">Release Radar</text>

    <g font-size="18">
      <text x="56" y="160" dominant-baseline="middle" fill="#94a3b8">○  Dashboard</text>
      <text x="56" y="210" dominant-baseline="middle" fill="#63e6ff">●  Review Queue</text>
      <text x="56" y="260" dominant-baseline="middle" fill="#94a3b8">○  Fleet</text>
      <text x="56" y="310" dominant-baseline="middle" fill="#94a3b8">○  Software</text>
      <text x="56" y="360" dominant-baseline="middle" fill="#94a3b8">○  Settings</text>
    </g>

    <text x="318" y="78" dominant-baseline="middle" fill="#f8fafc" font-size="34" font-weight="700">Review Queue</text>
    <text x="318" y="114" dominant-baseline="middle" fill="#94a3b8" font-size="16">Decide what to update, wait on or ignore · Demo data</text>

    <g transform="translate(318 150)">
      <rect width="1026" height="62" rx="16" fill="#131e33"/>
      <text x="34" y="31" dominant-baseline="middle" fill="#94a3b8" font-size="15">7 updates</text>

      <rect x="150" y="14" width="168" height="34" rx="17" fill="#163b42"/>
      <text x="234" y="31" text-anchor="middle" dominant-baseline="middle" fill="#63e6ff" font-size="14" font-weight="700">ALL PRIORITIES</text>

      <rect x="338" y="14" width="154" height="34" rx="17" fill="#1f3146"/>
      <text x="415" y="31" text-anchor="middle" dominant-baseline="middle" fill="#c4b5fd" font-size="14" font-weight="700">ALL RISKS</text>
    </g>

    <g transform="translate(318 238)">
      <rect width="1026" height="206" rx="20" fill="#131e33"/>

      <text x="40" y="48" dominant-baseline="middle" fill="#f8fafc" font-size="25" font-weight="700">Demo Media Server · 1.4.2 → 1.5.0</text>

      <rect x="40" y="78" width="108" height="38" rx="19" fill="#422d19"/>
      <text x="94" y="97" text-anchor="middle" dominant-baseline="middle" fill="#f5c56b" font-size="15" font-weight="700">HIGH</text>

      <rect x="164" y="78" width="164" height="38" rx="19" fill="#3d2330"/>
      <text x="246" y="97" text-anchor="middle" dominant-baseline="middle" fill="#fda4af" font-size="15" font-weight="700">MEDIUM RISK</text>

      <text x="40" y="150" fill="#94a3b8" font-size="16">
        <tspan x="40" dy="0">Highlights: security fixes and database migration notes.</tspan>
        <tspan x="40" dy="27">Improved transcoding reliability is also included.</tspan>
      </text>

      <rect x="782" y="146" width="108" height="42" rx="21" fill="#173f34"/>
      <text x="836" y="167" text-anchor="middle" dominant-baseline="middle" fill="#a7f3d0" font-size="14" font-weight="700">UPDATE</text>

      <rect x="906" y="146" width="80" height="42" rx="21" fill="#263650"/>
      <text x="946" y="167" text-anchor="middle" dominant-baseline="middle" fill="#e2e8f0" font-size="14" font-weight="700">WAIT</text>
    </g>

    <g transform="translate(318 472)">
      <rect width="1026" height="206" rx="20" fill="#131e33"/>

      <text x="40" y="48" dominant-baseline="middle" fill="#f8fafc" font-size="25" font-weight="700">Demo Reverse Proxy · 2.9.0 → 2.9.1</text>

      <rect x="40" y="78" width="128" height="38" rx="19" fill="#173f34"/>
      <text x="104" y="97" text-anchor="middle" dominant-baseline="middle" fill="#a7f3d0" font-size="15" font-weight="700">NORMAL</text>

      <rect x="184" y="78" width="136" height="38" rx="19" fill="#1f3146"/>
      <text x="252" y="97" text-anchor="middle" dominant-baseline="middle" fill="#cbd5e1" font-size="15" font-weight="700">LOW RISK</text>

      <text x="40" y="150" fill="#94a3b8" font-size="16">
        <tspan x="40" dy="0">Highlights: patch release with bug fixes.</tspan>
        <tspan x="40" dy="27">No configuration migration is noted.</tspan>
      </text>

      <rect x="782" y="146" width="108" height="42" rx="21" fill="#173f34"/>
      <text x="836" y="167" text-anchor="middle" dominant-baseline="middle" fill="#a7f3d0" font-size="14" font-weight="700">UPDATE</text>

      <rect x="906" y="146" width="80" height="42" rx="21" fill="#263650"/>
      <text x="946" y="167" text-anchor="middle" dominant-baseline="middle" fill="#e2e8f0" font-size="14" font-weight="700">WAIT</text>
    </g>

    <g transform="translate(318 706)">
      <rect width="1026" height="206" rx="20" fill="#131e33"/>

      <text x="40" y="48" dominant-baseline="middle" fill="#f8fafc" font-size="25" font-weight="700">Demo Metrics Agent · 0.18.5 → 0.19.0</text>

      <rect x="40" y="78" width="128" height="38" rx="19" fill="#1f3146"/>
      <text x="104" y="97" text-anchor="middle" dominant-baseline="middle" fill="#cbd5e1" font-size="15" font-weight="700">NORMAL</text>

      <rect x="184" y="78" width="172" height="38" rx="19" fill="#422d19"/>
      <text x="270" y="97" text-anchor="middle" dominant-baseline="middle" fill="#f5c56b" font-size="15" font-weight="700">MEDIUM RISK</text>

      <text x="40" y="150" fill="#94a3b8" font-size="16">
        <tspan x="40" dy="0">Highlights: new collector features are available.</tspan>
        <tspan x="40" dy="27">Review configuration compatibility before rollout.</tspan>
      </text>

      <rect x="782" y="146" width="108" height="42" rx="21" fill="#173f34"/>
      <text x="836" y="167" text-anchor="middle" dominant-baseline="middle" fill="#a7f3d0" font-size="14" font-weight="700">UPDATE</text>

      <rect x="906" y="146" width="80" height="42" rx="21" fill="#263650"/>
      <text x="946" y="167" text-anchor="middle" dominant-baseline="middle" fill="#e2e8f0" font-size="14" font-weight="700">WAIT</text>
    </g>

    <text x="318" y="940" dominant-baseline="middle" fill="#64748b" font-size="14">Reference screenshot · neutral demo data · not a production capture</text>
  </g>
</svg>
