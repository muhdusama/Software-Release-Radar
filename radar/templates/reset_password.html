{% extends "base.html" %}
{% block title %}Choose password · Software Release Radar{% endblock %}
{% block content_class %}auth-content{% endblock %}
{% block content %}
<section class="auth-card">
  <span class="eyebrow">PASSWORD RECOVERY</span>
  <h1>Choose a new password</h1>
  <p>Account: <strong>{{ username }}</strong></p>
  <form method="post" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>New password<input type="password" name="password" minlength="10" autocomplete="new-password" required></label>
    <label>Confirm password<input type="password" name="confirm_password" minlength="10" autocomplete="new-password" required></label>
    <button class="button primary wide" type="submit">Change password</button>
  </form>
</section>
{% endblock %}
